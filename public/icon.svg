<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Geometric Islamic 8-Point Star Border (Subtle) -->
  <g transform="translate(256, 256) scale(0.85)" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.4">
    <rect x="-160" y="-160" width="320" height="320" rx="20" />
    <rect x="-160" y="-160" width="320" height="320" rx="20" transform="rotate(45)" />
  </g>
  
  <!-- Quran Book / Rehal Symbol -->
  <g transform="translate(256, 260) scale(0.9)">
    <!-- Open Book Pages -->
    <path d="M-130,-40 C-70,-70 -30,-50 0,-30 C30,-50 70,-70 130,-40 C140,-35 140,75 130,80 C70,50 30,70 0,90 C-30,70 -70,50 -130,80 C-140,75 -140,-35 -130,-40 Z" fill="#ffffff" opacity="0.95" />
    
    <!-- Gold Ribbon / Spine -->
    <path d="M-5,-30 Q0,-35 5,-30 L5,115 Q0,110 -5,115 Z" fill="url(#goldGrad)" />
    
    <!-- Arabic Calligraphy Accent: "يس" (Yaseen) Motif -->
    <text x="0" y="32" font-family="'Amiri', serif" font-size="70" font-weight="bold" fill="#065f46" text-anchor="middle" direction="rtl">يس</text>
    
    <!-- Rehal (Book Stand) Base -->
    <path d="M-90,110 L90,150 M90,110 L-90,150" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" />
  </g>
  
  <!-- Floating Crescent & Star Accent -->
  <g transform="translate(256, 110) scale(0.55)">
    <path d="M0,-45 A45,45 0 1,0 45,35 A35,35 0 1,1 0,-45 Z" fill="url(#goldGrad)" />
    <polygon points="15,-15 19,-5 30,-5 21,3 24,14 15,8 6,14 9,3 0,-5 11,-5" fill="url(#goldGrad)" />
  </g>
</svg>
