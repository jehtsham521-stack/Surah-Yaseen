name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Capacitor and Android Platform
        run: |
          npm install --save @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Surah Yaseen" "com.surahyaseen.app" --web-dir dist
          npx cap add android
          npx cap copy android

      - name: Build Android APK (Debug / Direct Installable)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Surah-Yaseen-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
